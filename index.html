<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benimle Çıkar mısın? 💗</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(135deg, #ffd6e8, #fff);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Kart */
.card {
  background: white;
  padding: 35px;
  border-radius: 25px;
  text-align: center;
  z-index: 10;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

h1 {
  color: #ff4d88;
  margin-bottom: 30px;
}

.buttons {
  display: flex;
  gap: 20px;
  justify-content: center;
  position: relative;
}

button {
  padding: 15px 30px;
  border-radius: 30px;
  border: none;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.3s ease;
}

#yes {
  background: #ff4d88;
  color: white;
  transform: scale(1);
}

#no {
  background: #ddd;
  position: absolute;
}

/* Kalpler */
.heart {
  position: absolute;
  bottom: -20px;
  color: #ff4d88;
  font-size: 20px;
  animation: float 6s linear infinite;
  opacity: 0.7;
}

@keyframes float {
  0% {
    transform: translateY(0) scale(1);
    opacity: 0.8;
  }
  100% {
    transform: translateY(-110vh) scale(1.5);
    opacity: 0;
  }
}
</style>
</head>

<body>

<audio autoplay loop>
  <source src="jigsaw.mp3" type="audio/mpeg">
</audio>

<div class="card">
  <h1>Benimle çıkar mısın? 💕</h1>
  <div class="buttons">
    <button id="yes">Evet 💖</button>
    <button id="no">Hayır 🙃</button>
  </div>
</div>

<script>
let scale = 1;
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");

// Hayır kaçıyor
noBtn.addEventListener("mouseover", () => {
  const x = Math.random() * 200 - 100;
  const y = Math.random() * 200 - 100;
  noBtn.style.transform = `translate(${x}px, ${y}px)`;
  scale += 0.15;
  yesBtn.style.transform = `scale(${scale})`;
});

// Evet basınca
yesBtn.addEventListener("click", () => {
  alert("💘 TAMAMDIR. EN DOĞRU KARAR 💘");
});

// Kalpler oluştur
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "💗";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = Math.random() * 20 + 15 + "px";
  heart.style.animationDuration = Math.random() * 3 + 4 + "s";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 7000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
