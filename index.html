<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>💖 Benimle Çıkar mısın?</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Comic Sans MS", cursive;
}

body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(135deg, #ffd6e8, #fff);
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  text-align: center;
  z-index: 10;
}

h1 {
  font-size: 2rem;
  margin-bottom: 30px;
  color: #ff4d88;
}

.buttons {
  position: relative;
  height: 200px;
}

button {
  padding: 15px 30px;
  font-size: 1.2rem;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  transition: all 0.3s ease;
}

#yes {
  background-color: #ff4d88;
  color: white;
}

#no {
  background-color: #aaa;
  color: white;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

.heart {
  position: absolute;
  font-size: 20px;
  color: #ff6fa1;
  animation: float 6s linear infinite;
}

@keyframes float {
  0% {
    transform: translateY(100vh) scale(0.5);
    opacity: 1;
  }
  100% {
    transform: translateY(-10vh) scale(1.2);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="container">
  <h1>Benimle çıkar mısın? 💕</h1>
  <div class="buttons">
    <button id="yes">Evet 💖</button>
    <button id="no">Hayır 🙄</button>
  </div>
</div>

<!-- MÜZİK -->
<audio id="music" loop>
  <source src="jigsaw.mp3" type="audio/mpeg">
</audio>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const music = document.getElementById("music");

// HAYIR KAÇMA
function moveNo() {
  const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
  const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  // EVET BÜYÜSÜN
  const currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
  yesBtn.style.fontSize = (currentSize + 3) + "px";
}

// PC
noBtn.addEventListener("mouseover", moveNo);
noBtn.addEventListener("click", moveNo);

// TELEFON
noBtn.addEventListener("touchstart", function(e) {
  e.preventDefault();
  moveNo();
});

// EVET TIKLANINCA
yesBtn.addEventListener("click", () => {
  document.body.innerHTML = "<h1 style='color:#ff4d88;'>💘 YAŞASIN 💘</h1>";
});

// KALPLER
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "💖";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 20 + 10) + "px";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 6000);
}
setInterval(createHeart, 300);

// MÜZİK (ilk dokunuşta)
document.body.addEventListener("click", () => {
  music.play();
}, { once: true });

document.body.addEventListener("touchstart", () => {
  music.play();
}, { once: true });
</script>

</body>
</html>
